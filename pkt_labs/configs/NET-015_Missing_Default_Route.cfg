! ===================================================
! Packet Tracer Lab Config: NET-015 (Missing Default Route)
! Target Device: Branch-R1 (Cisco 4331 Router)
! ===================================================
enable
configure terminal
hostname Branch-R1

interface GigabitEthernet0/0/0
 description LAN Gateway
 ip address 192.168.10.1 255.255.255.0
 no shutdown
exit

interface Serial0/1/0
 description WAN Link to ISP
 ip address 10.1.1.2 255.255.255.252
 no shutdown
exit

! NOTE: 'ip route 0.0.0.0 0.0.0.0 Serial0/1/0' is missing!

end
write memory
