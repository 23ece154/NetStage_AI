! ===================================================
! Packet Tracer Lab Config: NET-001 (VLAN Trunk Missing)
! Target Device: Switch-1 (Cisco 2960)
! ===================================================
enable
configure terminal
hostname Switch-1

vlan 10
 name Sales
vlan 20
 name Mgmt
vlan 30
 name Server
exit

interface FastEthernet0/1
 description Connected to PC-1
 switchport mode access
 switchport access vlan 10
 no shutdown
exit

interface FastEthernet0/24
 description Trunk to Router-1
 switchport mode trunk
 switchport trunk allowed vlan 1-10,20
! NOTE: VLAN 30 is intentionally omitted from trunk allowed list
 no shutdown
exit

end
write memory
